# Corbett Foothills Retreat — Cloudflare Pages configuration
# https://corbett.life
#
# Deploy: npm run cf:deploy
# (builds with `astro build` then deploys `dist/` via wrangler)

name = "corbett-life"
compatibility_date = "2024-10-15"
pages_build_output_dir = "./dist"

# Environment variables for newsletter function
# Set these via `wrangler pages secret put BREVO_API_KEY`
# or in Cloudflare Dashboard > Pages > corbett-life > Settings > Environment variables
[vars]
BREVO_LIST_ID = ""
SENDER_EMAIL = "noreply@corbett.life"
SENDER_NAME = "Corbett Foothills Retreat"
